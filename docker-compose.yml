services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-research_harness}
      POSTGRES_USER: ${POSTGRES_USER:-research_harness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-research_harness} -d ${POSTGRES_DB:-research_harness}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
